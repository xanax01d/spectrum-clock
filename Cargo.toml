[package]
name = "spectrum-clock"
version = "0.1.0"
edition = "2024"
description = "Real-time terminal audio spectrum visualizer, clock, and synced lyrics viewer"
license = "MIT"
readme = "README.md"
keywords = ["audio", "visualizer", "spectrum", "clock", "tui"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
anyhow = "1.0"
chrono = "0.4"
cpal = "0.15"
crossterm = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ratatui = "0.29"
rustfft = "6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Foundation",
    "Media_Control",
    "Storage_Streams",
    "UI_ViewManagement",
] }
